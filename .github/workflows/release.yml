name: Release PyPI

# 仅 tag 推送发版: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

# 测试在本地跑 (scripts/test_all.bat, 3.4/3.7/3.12), 服务端只做构建校验与发布
jobs:
  build:
    name: build & verify version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整 tag 历史才能发现版本漂移
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # 校验 tag 与包版本一致 (vX.Y.Z <-> pyproject version / __version__), 有漂移直接失败
      - name: verify tag matches package version
        run: python scripts/version.py check --tag "${GITHUB_REF_NAME}"
      - name: build wheel + sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: publish to PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write                    # PyPI Trusted Publishing (OIDC)
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # 凭据二选一:
      #   1) 仓库 Secrets 配置 PYPI_API_TOKEN (pypi.org 的 API token, 需勾选 pyzk20r 项目)
      #   2) 或用 Trusted Publishing: pypi.org 项目页配置 publisher
      #      owner=yunluo repo=pyzk20r workflow=release.yml environment=pypi
      #      (仓库名没有下划线, 填错会报 "no publisher found")
      - name: publish (API token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
      - name: publish (Trusted Publishing)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
