name: Release PyPI

# 仅 tag 推送发版: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: 发布前测试 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      - run: uv run pytest -q

  build:
    name: 构建并校验版本
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 校验 tag 与包版本一致 (vX.Y.Z <-> __version__)
        run: |
          uv run --no-sync python -c "import os, pyzk20r; tag = os.environ['GITHUB_REF_NAME']; assert pyzk20r.__version__ == tag[1:], 'tag %s 与 pyzk20r.__version__ %s 不一致' % (tag, pyzk20r.__version__)"
      - name: 构建 wheel + sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: 发布 PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write                    # PyPI Trusted Publishing (OIDC)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # 前置: 在 pypi.org 的 pyzk20r 项目页配置 Trusted Publisher
      #   owner=yunluo  repo=pyzk_20r  workflow=release.yml  environment=pypi
      # 若改用 API Token: 在 repo Secrets 添加 PYPI_API_TOKEN, 并把下面 step 改为
      #   with: password: ${{ secrets.PYPI_API_TOKEN }}  (并移除 permissions.id-token)
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
