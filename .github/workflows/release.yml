name: Release PyPI

# 仅 tag 推送发版: git tag v0.1.0 && git push origin v0.1.0
on:
  push:
    tags: ["v*"]

jobs:
  test:
    name: 发布前测试 (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
      - run: uv sync
      # 用 python -m 方式调用 pytest: Windows 上 .exe shim 在部分环境会被当成源码解析
      - run: uv run python -m pytest -q
        env:
          PYTHONIOENCODING: utf-8    # Windows runner 默认 cp1252, 中文输出会崩

  build:
    name: 构建并校验版本
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整 tag 历史才能发现版本漂移
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # 校验 tag 与包版本一致 (vX.Y.Z <-> pyproject version / __version__), 有漂移直接失败
      - name: 校验 tag 与包版本一致
        run: python scripts/version.py check --tag "${GITHUB_REF_NAME}"
      - name: 构建 wheel + sdist
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    name: 发布 PyPI
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write                    # PyPI Trusted Publishing (OIDC)
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      # 凭据二选一:
      #   1) 仓库 Secrets 配置 PYPI_API_TOKEN (pypi.org 的 API token, 需勾选 pyzk20r 项目)
      #   2) 或用 Trusted Publishing: pypi.org 项目页配置 publisher
      #      owner=yunluo repo=pyzk_20r workflow=release.yml environment=pypi
      - name: 发布 PyPI (API Token)
        if: env.PYPI_API_TOKEN != ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/
      - name: 发布 PyPI (Trusted Publishing)
        if: env.PYPI_API_TOKEN == ''
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
