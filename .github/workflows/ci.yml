name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # lint 工具用 uvx 隔离运行 (不受项目 requires-python 约束影响);
      # 版本锁定在本地验证过的区间, 避免格式化规则随版本漂移导致误报
      - name: ruff lint
        run: uvx "ruff>=0.17,<0.18" check .
      - name: ruff format 检查
        run: uvx "ruff>=0.17,<0.18" format --check .
      - name: mypy 类型检查
        run: uvx --from "mypy>=2.4,<3" mypy src/pyzk20r
      - name: 构建产物校验
        run: uv build

  version:
    name: 版本一致性检查
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整 tag 历史才能发现版本漂移
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 校验 pyproject.toml / __init__.py 的 __version__ / git tag 三处版本一致
      - name: 版本号漂移检查
        run: python scripts/version.py check

  test:
    name: pytest (py${{ matrix.python-version }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.7", "3.10", "3.13"]   # 3.7 = 支持下限
    runs-on: windows-latest                  # 本库仅支持 Windows
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 同步依赖 (含 dev 组)
        run: uv sync
      - name: 测试 (mock 全量 + 真机冒烟自动跳过)
        run: uv run python -m pytest -q
