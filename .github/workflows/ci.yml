name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: 同步依赖 (含 dev 组)
        run: uv sync
      - name: ruff lint
        run: uv run ruff check .
      - name: mypy 类型检查
        run: uv run mypy
      - name: 构建产物校验
        run: uv build

  test:
    name: pytest ({0} / py{1})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 同步依赖 (含 dev 组)
        run: uv sync
      - name: 测试 (mock 全量 + 真机冒烟自动跳过)
        run: uv run pytest -q
