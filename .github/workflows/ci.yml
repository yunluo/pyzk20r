name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # lint 工具用 uvx 隔离运行 (不受项目 requires-python 约束影响);
      # 版本锁定在本地验证过的区间, 避免格式化规则随版本漂移导致误报
      - name: ruff lint
        run: uvx "ruff>=0.17,<0.18" check .
      - name: ruff format check
        run: uvx "ruff>=0.17,<0.18" format --check .
      - name: ty type check
        run: uvx ty check
      - name: build artifacts
        run: uv build

  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整 tag 历史才能发现版本漂移
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 校验 pyproject.toml / __init__.py 的 __version__ / git tag 三处版本一致
      - name: version drift check
        run: python scripts/version.py check
