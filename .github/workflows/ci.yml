name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # lint 工具用 uvx 隔离运行, 不受项目 requires-python 约束影响
      - name: ruff lint
        run: uvx ruff check .
      - name: mypy 类型检查
        run: uvx --from "mypy>=1.10" mypy src/pyzk20r
      - name: 构建产物校验
        run: uv build

  test:
    name: pytest (py${{ matrix.python-version }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: windows-latest                  # 本库仅支持 Windows
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: 同步依赖 (含 dev 组)
        run: uv sync
      - name: 测试 (mock 全量 + 真机冒烟自动跳过)
        run: uv run python -m pytest -q
