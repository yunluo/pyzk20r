name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: lint & build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # lint 工具用 uvx 隔离运行 (不受项目 requires-python 约束影响);
      # 版本锁定在本地验证过的区间, 避免格式化规则随版本漂移导致误报
      - name: ruff lint
        run: uvx "ruff>=0.17,<0.18" check .
      - name: ruff format check
        run: uvx "ruff>=0.17,<0.18" format --check .
      - name: ty type check
        run: uvx ty check
      - name: build artifacts
        run: uv build

  version:
    name: version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0        # 需要完整 tag 历史才能发现版本漂移
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # 校验 pyproject.toml / __init__.py 的 __version__ / git tag 三处版本一致
      - name: version drift check
        run: python scripts/version.py check

  test:
    name: unittest (py${{ matrix.python-version }})
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]
    runs-on: windows-latest                  # 本库仅支持 Windows
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: sync deps (project itself)
        run: uv sync
      - name: tests (mock suite + real-device smoke, auto-skip)
        env:
          PYTHONIOENCODING: utf-8    # Windows runner 默认 cp1252, 中文输出会崩
        run: uv run python -m unittest discover -s tests -v

  test-py37:
    name: unittest (py3.7, lowest CI-verifiable)
    needs: lint
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      # uv 不再支持 Python 3.7 (且 uv_build 后端要求 >=3.8), 这一档用裸解释器;
      # 标准库 unittest 无需安装任何第三方依赖;
      # runner 镜像无 Python 3.4, 库声明的 3.4 下限由 ast 语法守卫测试覆盖
      - uses: actions/setup-python@v5
        with:
          python-version: "3.7"
      - name: tests (mock suite + real-device smoke, auto-skip)
        env:
          PYTHONIOENCODING: utf-8    # Windows runner 默认 cp1252, 中文输出会崩
        run: python -m unittest discover -s tests -v
