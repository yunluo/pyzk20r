[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project]
name = "pyzk20r"
version = "0.1.0"
description = "ZKTeco Live20R 指纹采集器 Python 库 (ZKFinger SDK C API, 纯 ctypes, 零依赖, 支持 Windows XP / Python 3.4+)"
readme = "README.md"
requires-python = ">=3.4"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yunluo" }]
keywords = ["zkteco", "fingerprint", "live20r", "biometrics", "libzkfp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows XP",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.zksps.com/productinfo/46887.html"

[tool.uv.build-backend]
module-name = "pyzk20r"
module-root = ""                             # 扁平布局: 模块在仓库根 (非 src/)
source-include = ["tests/**", "examples/**"]  # sdist 附带测试与示例
source-exclude = ["**/*.db"]                 # 排除指纹数据文件

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_device: 需要连接 Live20R 真机 (无设备自动跳过)",
]

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP004"]

[tool.mypy]
files = ["pyzk20r"]
