[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyzk20r"
dynamic = ["version"]
description = "ZKTeco Live20R 指纹采集器 Python 库 (ZKFinger SDK C API, 纯 ctypes, 零依赖, 支持 Windows XP / Python 3.4+)"
readme = "README.md"
requires-python = ">=3.4"
license = { text = "MIT" }
authors = [{ name = "yunluo" }]
keywords = ["zkteco", "fingerprint", "live20r", "biometrics", "libzkfp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows XP",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://www.zksps.com/productinfo/46887.html"

[tool.hatch.version]
path = "pyzk20r/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["pyzk20r"]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "mypy",
]

[tool.hatch.build.targets.sdist]
include = [
    "pyzk20r",
    "tests",
    "examples",
    "README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_device: 需要连接 Live20R 真机 (无设备自动跳过)",
]

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP004"]

[tool.mypy]
files = ["pyzk20r"]
