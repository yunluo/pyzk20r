[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project]
name = "pyzk20r"
version = "0.1.6"
description = "ZKTeco Live20R 指纹采集器 Python 库 (ZKFinger SDK C API, 纯 ctypes, 零依赖, 支持 Windows XP / Python 3.4+)"
readme = "README.md"
requires-python = ">=3.4"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yunluo" }]
keywords = ["zkteco", "fingerprint", "live20r", "biometrics", "libzkfp"]
# Python 3.4 无内置 typing 模块, 用官方 typing 移植包补齐 (现代版本不受影响)
dependencies = ['typing==3.10.0.0; python_version < "3.5"']
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows XP",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.4",
    "Programming Language :: Python :: 3.5",
    "Programming Language :: Python :: 3.6",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/yunluo/pyzk20r"

[tool.uv.build-backend]
module-name = "pyzk20r"
module-root = "src"                           # src 布局: 模块在 src/ 下
source-include = ["tests/**", "examples/**", "CHANGELOG.md"]  # sdist 附带测试/示例/变更日志
source-exclude = ["**/*.db"]                 # 排除指纹数据文件

[tool.ruff]
line-length = 120
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP004"]

[tool.ty.src]
include = ["src/pyzk20r"]

[tool.ty.environment]
python-version = "3.7"       # ty 最低只支持 3.7; 运行时兼容声明为 3.4 (3.4 装 typing 移植)
python-platform = "win32"     # 本库仅支持 Windows
