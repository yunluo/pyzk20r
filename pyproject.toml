[build-system]
requires = ["uv_build>=0.8.22,<0.9.0"]
build-backend = "uv_build"

[project]
name = "pyzk20r"
version = "0.1.2"
description = "ZKTeco Live20R 指纹采集器 Python 库 (ZKFinger SDK C API, 纯 ctypes, 零依赖, 支持 Windows XP / Python 3.7+)"
readme = "README.md"
requires-python = ">=3.7"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yunluo" }]
keywords = ["zkteco", "fingerprint", "live20r", "biometrics", "libzkfp"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: Microsoft :: Windows :: Windows XP",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.7",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

[project.urls]
Homepage = "https://github.com/yunluo/pyzk20r"

[tool.uv.build-backend]
module-name = "pyzk20r"
module-root = "src"                           # src 布局: 模块在 src/ 下
source-include = ["tests/**", "examples/**"]  # sdist 附带测试与示例
source-exclude = ["**/*.db"]                 # 排除指纹数据文件

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "real_device: 需要连接 Live20R 真机 (无设备自动跳过)",
]

[tool.ruff]
line-length = 100
target-version = "py37"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP004"]

[tool.ty.src]
include = ["src/pyzk20r"]

[tool.ty.environment]
python-version = "3.7"       # 项目支持下限, 按 3.7 校验语法与标准库
python-platform = "win32"     # 本库仅支持 Windows
